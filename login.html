<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | 4ARU Study</title><link rel="stylesheet" href="css/login.css"></head><body><main class="auth-shell"><div class="brand">4ARU<span>STUDY RESOURCES</span></div><section class="card"><h1 id="login-title">Admin Login</h1><p id="login-intro" class="intro">CGPSC resources manage karne ke liye apne admin email aur password se login karein.</p><form id="admin-login-form"><div class="field"><label for="email">Admin email</label><input id="email" type="email" autocomplete="email" value="4k4sh07@gmail.com" required></div><div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your admin password" required></div><button id="login-button" class="primary" type="submit">Secure admin login</button></form><form id="password-reset-form" class="hidden"><div class="field"><label for="new-password">New admin password</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" placeholder="Minimum 8 characters" required></div><div class="field"><label for="confirm-password">Confirm password</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" placeholder="Repeat password" required></div><button id="save-password-button" class="primary" type="submit">Save password and open dashboard</button></form><button id="forgot-password" class="resend" type="button">Set / reset admin password</button><p id="status" class="status" role="status" aria-live="polite"></p><div class="security">🔒 यह login Supabase Authentication से होता है। Password website या GitHub में save नहीं किया जाता।</div><a class="back" href="index.html">← Home पर वापस जाएँ</a></section></main><script src="js/supabase-config.js"></script><script src="js/login.js" defer></script></body></html>
