<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login | 4ARU Study</title><link rel="stylesheet" href="css/login.css"></head><body><main class="auth-shell"><div class="brand">4ARU<span>STUDY RESOURCES</span></div><section class="card"><h1>Login / Sign Up</h1><p class="intro">अपने email पर आए OTP से सुरक्षित तरीके से प्रवेश करें। Password की जरूरत नहीं।</p><div id="email-step"><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com" required></div><button id="email-button" class="primary" data-label="Send OTP">Send OTP</button></div><div id="otp-step" class="hidden"><div class="field"><label for="otp">6-digit OTP</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" placeholder="123456"></div><button id="verify-button" class="primary" data-label="Verify OTP">Verify OTP</button><button id="resend" class="resend" type="button">Resend OTP</button><button id="change-email" class="resend" type="button">Change email</button></div><p id="status" class="status" role="status" aria-live="polite"></p><div class="security">🔒 आपका email केवल account verification के लिए इस्तेमाल होगा। OTP कभी share न करें।</div><a class="back" href="index.html">← Home पर वापस जाएँ</a></section></main><script src="js/supabase-config.js"></script><script src="js/login.js" defer></script></body></html>
